name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: touch database/database.sqlite && php artisan migrate --force
      - name: Laravel Pint
        run: composer lint:check
      - name: Larastan
        if: ${{ !cancelled() }}
        run: composer types:check -- --no-progress --error-format=table
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            php: '8.3'
          - variant: team
            php: '8.4'
          - variant: organization
            php: '8.5'
          - variant: company
            php: '8.4'
          - variant: study_group
            php: '8.4'
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer validate --no-check-lock
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - id: configure
        run: |
          if [ "$VARIANT" = base ]; then
            php artisan starter-kit:install --no-teams --auth=both --no-interaction
          else
            php artisan starter-kit:install --teams --team-name="$VARIANT" --auth=both --no-interaction
          fi
        env:
          VARIANT: ${{ matrix.variant }}
      - run: php artisan test
      - id: schema
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          touch database/database.sqlite
          php artisan migrate --force
      - if: ${{ !cancelled() && steps.schema.outcome == 'success' }}
        run: php artisan config:cache && php artisan route:cache && php artisan optimize:clear
      - id: node_dependencies
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: npm install --ignore-scripts
      - id: api_contract
        if: ${{ !cancelled() && steps.node_dependencies.outcome == 'success' && steps.schema.outcome == 'success' }}
        run: composer api:generate
      - if: ${{ !cancelled() && steps.api_contract.outcome == 'success' }}
        run: npx tsc --noEmit generated/api.d.ts
      - if: ${{ !cancelled() && steps.api_contract.outcome == 'success' && matrix.variant == 'base' }}
        name: HTTP authentication smoke test
        env:
          APP_URL: http://127.0.0.1:8000
          FRONTEND_WEB_URL: http://127.0.0.1:3000
          FRONTEND_WEB_ORIGIN: http://127.0.0.1:3000
          FRONTEND_MOBILE_URL: https://mobile.example.test
          AUTH_RATE_LIMIT: 100
          AUTH_SENSITIVE_RATE_LIMIT: 100
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/starter-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; tail -n 40 /tmp/starter-server.log' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then break; fi
            sleep 1
          done
          node scripts/http-smoke.mjs
      - if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: composer audit

  auth-mode:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [stateful, stateless]
    env:
      STARTER_KIT_AUTH: ${{ matrix.mode }}
      APP_URL: http://127.0.0.1:8000
      FRONTEND_WEB_URL: http://127.0.0.1:3000
      FRONTEND_WEB_ORIGIN: http://127.0.0.1:3000
      FRONTEND_MOBILE_URL: https://mobile.example.test
      AUTH_RATE_LIMIT: 100
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Configure selected authentication mode and validate installer input
        run: |
          if php artisan starter-kit:install --no-teams --auth="$STARTER_KIT_AUTH" --frontend='{"id":"bad","url":42}' --no-interaction; then
            echo "Invalid frontend was unexpectedly accepted"
            exit 1
          fi
          test ! -f .starter-kit-installed
          if [ "$STARTER_KIT_AUTH" = stateful ]; then
            php artisan starter-kit:install --no-teams --auth=stateful --frontend='{"id":"web","url":"http://127.0.0.1:3000","authentication":"stateful"}' --no-interaction
          else
            php artisan starter-kit:install --no-teams --auth=stateless --frontend='{"id":"mobile","url":"https://mobile.example.test","authentication":"stateless"}' --no-interaction
          fi
          grep -Fx "STARTER_KIT_AUTH=$STARTER_KIT_AUTH" .env.example
          test -f config/frontend-clients.php
      - run: touch database/database.sqlite && php artisan migrate --force
      - run: npm install --ignore-scripts && composer api:generate
      - run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/starter-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; tail -n 40 /tmp/starter-server.log' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then break; fi
            sleep 1
          done
          node scripts/http-smoke.mjs
  databases:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: starter_kit
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: starter_kit
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan starter-kit:install --teams --team-name=workspace --no-interaction
      - name: MySQL integration suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: starter_kit
          DB_USERNAME: root
          DB_PASSWORD: test-password
        run: php artisan test
      - name: PostgreSQL integration suite
        if: ${{ !cancelled() }}
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: starter_kit
          DB_USERNAME: postgres
          DB_PASSWORD: test-password
        run: php artisan test
  installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite
      - name: Install independent Composer project
        run: |
          mkdir -p /tmp/starter-source
          git archive HEAD | tar -x -C /tmp/starter-source
          composer create-project --repository='{"type":"path","url":"/tmp/starter-source","options":{"symlink":false,"versions":{"rasmuspjustesen/laravel-api-starter-kit":"dev-main"}}}' --stability=dev --no-interaction --remove-vcs rasmuspjustesen/laravel-api-starter-kit /tmp/starter-application dev-main
          cd /tmp/starter-application
          test ! -d .git
          test -f .starter-kit-installed
          php artisan migrate:status
          php artisan tinker --execute='App\Models\User::factory()->create(["email" => "existing@example.test"]);'
          php artisan starter-kit:teams --team-name=workspace --team-plural=collectives --personal-teams --no-interaction
          composer dump-autoload
          php artisan optimize:clear
          php artisan migrate --force
          php artisan tinker --execute='if (! App\Models\User::where("email", "existing@example.test")->firstOrFail()->personalWorkspace()) { throw new RuntimeException("Personal workspace not provisioned"); }'
          php artisan test
      - name: Verify Laravel installer hooks
        run: |
          composer global require laravel/installer --no-interaction
          composer config --global repositories.starter '{"type":"path","url":"/tmp/starter-source","options":{"symlink":false,"versions":{"rasmuspjustesen/laravel-api-starter-kit":"dev-main"}}}'
          "$(composer global config bin-dir --absolute)/laravel" new /tmp/starter-laravel-app --using=rasmuspjustesen/laravel-api-starter-kit --no-interaction --no-node --no-boost --phpunit --database=sqlite
          cd /tmp/starter-laravel-app
          test -f .starter-kit-installed
          php artisan migrate:status
          php artisan test

  first-release:
    # One-time publication of the requested beta, only from a green main push.
    if: ${{ github.repository == 'RasmusPJustesen/laravel-api-starter-kit' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Prepare v0.1.0-beta.1 release' }}
    needs: [quality, test, auth-mode, databases, installation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.1.0-beta.1
    steps:
      - name: Publish verified beta release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" != "$GITHUB_SHA" ]; then
            echo "Main has moved; refusing to publish an outdated release."
            exit 1
          fi
          if existing="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha' 2>/dev/null)"; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "The release tag already points to another commit."
              exit 1
            fi
          fi
          if ! gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            cat > "$RUNNER_TEMP/release-notes.md" <<'RELEASE_NOTES'
            ## First public beta
            
            A headless Laravel 13 API starter kit inspired by the Laravel Maestro API and teams proposals, without an application frontend.
            
            ### What's included
            
            - Stateful Sanctum cookie authentication, stateless bearer tokens, or both.
            - Registration, profile management, email verification, password reset and password confirmation.
            - Optional or required TOTP two-factor authentication, QR setup and single-use recovery codes.
            - Unified browser/native device management, revocable persistent sessions and bearer token rotation.
            - Multiple frontend configurations, trusted origins and frontend-specific notification links.
            - Optional collaboration module with custom singular/plural naming, personal entities, roles, permissions, invitations and ownership transfer.
            - Scalar documentation, generated OpenAPI and TypeScript contracts, typed errors and locale negotiation.
            - Laravel installer and Composer project integration, deployment guidance and automated tests.
            
            ### Try the beta
            
            Requirements: PHP 8.3+, Composer 2, and Node.js 22+ for API type generation.
            
            ```bash
            git clone --branch v0.1.0-beta.1 --single-branch https://github.com/RasmusPJustesen/laravel-api-starter-kit.git my-api
            cd my-api
            composer setup
            php artisan serve
            ```
            
            After Packagist registration and indexing, the explicit version can be installed with:
            
            ```bash
            composer create-project rasmuspjustesen/laravel-api-starter-kit my-api 0.1.0-beta.1
            ```
            
            ### Validation and limitations
            
            This release is published only after the complete GitHub Actions test matrix passes: PHP 8.3–8.5, SQLite/MySQL/PostgreSQL, base and custom-named team variants, both standalone authentication modes, HTTP contract checks, installation, Pint and Larastan. It is a beta, not an independently audited production-ready release. Packagist installation still needs verification after registry publication.
            
            ### Credits
            
            Based on [Laravel Maestro #78](https://github.com/laravel/maestro/pull/78) and [#80](https://github.com/laravel/maestro/pull/80), authored by Wendell Adriel, with thanks to Joe Tannenbaum and the Laravel community. This is an independent MIT-licensed community project.
            RELEASE_NOTES
            printf '\n[Passing CI run](https://github.com/%s/actions/runs/%s) · Commit `%s`\n' "$GH_REPO" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG — First public beta" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --latest=false
          fi
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')" = "$GITHUB_SHA"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,url,targetCommitish
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '(.isPrerelease and (.isDraft | not))')" = true
